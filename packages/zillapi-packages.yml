summary: >-
  Zillapi ships NO general-purpose client SDKs — the quickstart documents raw HTTP in curl,
  JavaScript, Python and Go, which is four code samples, not four libraries. It does, however, ship
  FOUR first-party distributions, and three of them are agent- or automation-platform integrations
  rather than SDKs: an n8n community node published to npm (the only one with real registry
  metadata), an agent plugin for Claude/Cursor-class clients, an agent-skills bundle on GitHub, and
  the hosted agent-skills set served from its own /.well-known/ path. CORRECTION (2026-09-11): the
  2026-08-09 and earlier-today captures both stated the skills bundle was the only first-party
  distributable and that zillow-skills was the only public repo in the account. Both statements were
  wrong — they came from probing only the repo the provider links from llms.txt instead of listing
  the account.
sdks:
  count: 0
  note: >-
    No general-purpose client library was found on npm, PyPI, Maven Central, NuGet, pkg.go.dev,
    RubyGems, Packagist or crates.io. No `SDKs` pointer is emitted. The npm-published
    `n8n-nodes-zillapi` is genuinely first-party and genuinely on a registry, but it is an n8n
    workflow node — it can only be loaded by an n8n instance and exposes no importable client to an
    ordinary TypeScript program — so it is recorded as a platform connector, not an SDK. Calling it
    one would credit the provider with a developer library it does not ship, which is the same error
    as counting code samples.
