note: 'zillapi.com and www.zillapi.com return a real HTTP 404 (Astro "Page not found" shell) for unknown
  paths, and api.zillapi.com returns a JSON 404 with code not_found — both verified against a control
  URL — so the 200s below are genuine documents, not SPA catch-all responses. Every 200 was fetched and
  parsed as JSON. www.zillapi.com serves the identical document set as the apex.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
