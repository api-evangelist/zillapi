  - name: search-validation-failures
    operation: search
    source: https://zillapi.com/errors/
    status: 400
    request_response_pairs:
      - request: 'POST /v1/search {"maxItems": 50}'
        response: '{"error":{"code":"missing_input","message":"..."}}'
        why: nothing to search on
      - request: 'POST /v1/search {"filters":{"location":"Austin, TX","status":"for_sale"}}'
        response: '{"error":{"code":"invalid_filters","message":"..."}}'
        why: free-text location only, no bbox
      - request: 'POST /v1/search {"searchUrls":[{"url":"https://www.zillow.com/austin-tx/houses/"}]}'
        response: '{"error":{"code":"invalid_search_url","message":"..."}}'
        why: URL has no searchQueryState parameter
