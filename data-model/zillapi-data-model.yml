observations:
  - >-
    The two halves of the model never join: no operational entity carries a zpid, and no property
    entity carries a job or webhook id. The bridge is entirely procedural — you submit a batch, then
    fetch results.
  - >-
    Search and detail are separate representations of the same real-world thing with different field
    names for the same data (addressCity vs address.city). Any consumer building a warehouse has to
    reconcile them.
  - >-
    resoFacts is present in the spec but untyped, so the majority of the advertised 300+ fields are not
    machine-readable from the OpenAPI.
