name: Zillapi
description: >-
  Independent third-party provider of Zillow-sourced U.S. residential property data via a REST API, hosted MCP server,
  and agent skills. Returns ~300+ fields per property including price, Zestimate, rent Zestimate, photos, schools,
  taxes, and full price history, plus listing search, building extraction, async batch jobs, and signed webhooks.
