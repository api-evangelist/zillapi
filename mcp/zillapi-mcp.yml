  glama_listing:
    file: glama.json
    maintainers: [zillapi, therohitdas]
    note: >-
      Both zillow-mcp and zillow-api carry a glama.json naming the Glama MCP directory schema. It is
      a third-party directory claim, not a contract; recorded as a distribution channel only.
distributions:
  - channel: hosted-remote
    endpoint: https://api.zillapi.com/mcp
    transport: streamable-http
    auth: oauth2 (authorization_code + PKCE) or bearer API key
    primary: true
  - channel: mcp-registry-manifest
    manifest: mcp/zillapi-server.json
    name: com.zillapi/zillow-mcp
  - channel: agent-plugin
    repository: https://github.com/ZeroPointRepo/zillow-plugin
    standard: agent-plugins.org 1.0.0 (+ Claude and Cursor plugin marketplace formats)
    wires_to: https://api.zillapi.com/mcp
    adds: 1 skill (zillow) + 4 slash commands (property, search, zestimate, comps)
    see: packages/zillapi-packages.yml
    note: >-
      Adds no new tools. It is a manifest-and-prompt bundle over the same four remote tools, so it
      does not change `tool_count`.
  - channel: n8n-node
    package: https://www.npmjs.com/package/n8n-nodes-zillapi
    note: >-
      Calls the REST API, not the MCP endpoint. Listed here only so the full first-party integration
      surface is visible from one place; it is catalogued in packages/zillapi-packages.yml.
deployment:
