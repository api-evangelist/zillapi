  packages: []
  finding: >-
    NEW 2026-09-11. Zillapi publishes a second, independent MCP discovery document alongside its
    /.well-known/ server card: an official MCP-registry `server.json` (schema 2025-09-29) in the
    ZeroPointRepo/zillow-mcp repository, under the reverse-DNS name com.zillapi/zillow-mcp. Its
