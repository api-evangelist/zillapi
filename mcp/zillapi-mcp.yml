tool_count: 4
tools:
- name: lookup_property_by_address
  title: Look up a U.S. property by address
  category: properties
  description: Returns full Zillow property data for a U.S. address.
  source_operation: openapi/zillapi-openapi-original.json#getPropertyByAddress
- name: lookup_property_by_zpid
  title: Look up a U.S. property by Zillow zpid
  category: properties
  description: Returns full property data for a Zillow property id. Cache-served when fresh.
  source_operation: openapi/zillapi-openapi-original.json#getPropertyByZpid
- name: get_zestimate
  title: Get the current Zestimate for a property
  category: valuation
  description: Returns Zillow's automated valuation and rent Zestimate for a zpid.
  source_operation: openapi/zillapi-openapi-original.json#getPropertyZestimate
- name: search_listings
  title: Search U.S. property listings
  category: search
  description: Search for-sale, for-rent, or sold listings inside a geographic bounding box.
  source_operation: openapi/zillapi-openapi-original.json#listingsBbox
publisher:
  name: Zillapi
  url: https://zillapi.com
  contact: hello@zillapi.com
terms_of_service: https://zillapi.com/legal/trademark-and-affiliation/
notes: The MCP surface is a deliberate 4-tool subset of a 29-operation REST API — buildings, async batch
  jobs, webhooks, job management, sub-resources (photos, price history, tax history, schools, agent, open
  houses, facts) and account/usage are REST-only. See mcp/zillapi-tool-crosswalk.yml.
