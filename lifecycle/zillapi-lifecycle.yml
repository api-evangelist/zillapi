generated: '2026-09-11'
method: searched
source: https://zillapi.com/ + live probes 2026-09-11 (first probed 2026-08-09)
versioning:
  scheme: uri-path
  current: v1
  base_url: https://api.zillapi.com
  spec_version: 1.0.0
  notes: >-
    Every operation is served under /v1/. No version header, no date-based version train, no
    documented policy for how a v2 would be introduced or how long v1 would be supported.
changelog:
  published: false
  probes:
    - {url: 'https://zillapi.com/changelog/', status: 404, checked: '2026-09-11'}
    - {url: 'https://zillapi.com/blog/', status: 200, checked: '2026-09-11'}
    - {url: 'https://github.com/ZeroPointRepo/zillow-skills/releases', status: 200, checked: '2026-09-11', note: 'zero releases, zero tags'}
    - {url: 'https://api.github.com/users/ZeroPointRepo/repos', status: 200, checked: '2026-09-11', note: 'Account enumerated for the first time: 30 public repos, six Zillapi-branded. None carries a GitHub release or tag.'}
    - {url: 'https://registry.npmjs.org/n8n-nodes-zillapi', status: 200, checked: '2026-09-11', note: 'The ONLY dated release history the provider publishes anywhere: 0.1.0 (2026-08-10), 0.1.1 and 0.1.2 (both 2026-08-11). It versions a connector, not the API.'}
  notes: >-
    No dated changelog. The blog at https://zillapi.com/blog/ carries product and setup posts but is
    not a versioned change record. The npm release history of n8n-nodes-zillapi is the only dated,
    machine-readable release record in the provider's whole estate, and it tracks the connector
    rather than the API — it cannot be used to date an API change. No `ChangeLog` pointer is emitted.
  see: changelog/zillapi-changelog.yml
  measured_drift: >-
    Between 2026-08-09 and 2026-09-11 this pipeline observed the live OpenAPI change (the meta.cached
    object removed from several property responses) WITHOUT an info.version bump, and the RFC 9728
    protected-resource document change its `resource` identifier. Neither was announced anywhere. That
    makes info.version unusable as a change signal for a consumer. Details in
    changelog/zillapi-changelog.yml.
